<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EuroPress — European News Reader</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg:      #0e0e0e;
    --surface: #161616;
    --card:    #1c1c1c;
    --border:  #2a2a2a;
    --accent:  #c8f060;
    --accent2: #f0b860;
    --accent3: #60c8f0;
    --text:    #f0ede8;
    --muted:   #888;
    --bull:    #c8f060;
    --bear:    #ff6b6b;
    --radius:  16px;
    --radius-sm: 10px;
    --shadow:  0 2px 16px rgba(0,0,0,0.4);
    --shadow-hover: 0 6px 32px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(200,240,96,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% 90%, rgba(96,200,240,0.04) 0%, transparent 60%);
  }

  header, .app-body, .sidebar, .main { position: relative; z-index: 1; }

  /* ── TOP BAR ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 0 var(--border);
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: -0.3px;
    cursor: pointer;
  }
  .logo span { color: var(--accent); font-style: normal; }

  .search-bar {
    flex: 1;
    max-width: 520px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px 8px 40px;
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,240,96,0.1);
  }
  .search-bar svg {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
  }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* ── SOCIAL ICONS ── */
  .socials { display: flex; align-items: center; gap: 4px; }
  .social-link {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    color: var(--muted);
    border: 1px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .social-link:hover {
    color: var(--accent);
    background: rgba(200,240,96,0.07);
    border-color: rgba(200,240,96,0.2);
    transform: translateY(-1px);
  }
  .social-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  .lang-select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    border-radius: 50px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .lang-select:hover { border-color: var(--accent); }

  .refresh-btn {
    background: rgba(200,240,96,0.08);
    color: var(--accent);
    border: 1px solid rgba(200,240,96,0.25);
    border-radius: 50px;
    padding: 7px 16px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
  }
  .refresh-btn:hover { background: rgba(200,240,96,0.14); transform: scale(1.02); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    from { background-position: 200% center; }
    to   { background-position: -200% center; }
  }

  /* ── LAYOUT ── */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    height: calc(100vh - 58px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 10px 8px;
  }
  .sidebar-label::after {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--border);
    margin-top: 6px;
  }

  .journal-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    width: 100%;
    text-align: left;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .journal-btn:hover { background: var(--card); color: var(--text); border-color: var(--border); }
  .journal-btn.active {
    background: rgba(200,240,96,0.07);
    color: var(--accent);
    border-color: rgba(200,240,96,0.2);
    font-weight: 500;
  }
  .journal-btn .lang-chip {
    margin-left: auto;
    font-size: 0.55rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    text-transform: uppercase;
  }

  .journal-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 500;
    flex-shrink: 0;
    letter-spacing: -0.5px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
  }
  .journal-icon.emoji { font-size: 0.9rem; background: var(--card); }

  /* ── MAIN ── */
  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── JOURNAL HEADER ── */
  .journal-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 0;
    position: sticky;
    top: 0;
    z-index: 50;
    animation: fadeDown 0.3s ease both;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
    margin-bottom: 14px;
  }
  .back-btn:hover {
    background: var(--card);
    border-color: var(--accent);
    color: var(--accent);
  }
  .back-btn svg { flex-shrink: 0; }

  .journal-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .journal-title h1 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--text);
    line-height: 1.1;
  }
  .journal-title .flag { font-size: 1.1rem; font-style: normal; }
  .journal-subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  /* ── CATEGORY TABS ── */
  .cat-tabs {
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }

  .cat-tab {
    padding: 9px 18px;
    border: none;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    transition: color 0.15s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text); }
  .cat-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

  /* ── ARTICLE GRID ── */
  .articles-area { padding: 24px 28px; flex: 1; overflow-y: auto; }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  .article-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px 20px;
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.35s ease both;
    color: inherit;
    user-select: none;
  }
  .article-card.clickable { cursor: pointer; }
  .article-card.clickable:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
    border-color: #3a3a3a;
  }
  .article-card.clickable:active { transform: scale(0.99); }

  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .card-category-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    width: fit-content;
    border: 1px solid rgba(200,240,96,0.25);
    background: rgba(200,240,96,0.07);
    color: var(--accent);
  }

  .card-journal-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    width: fit-content;
    border: 1px solid var(--border);
  }

  .trans-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 0.58rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid rgba(96,200,240,0.28);
    background: rgba(96,200,240,0.08);
    color: var(--accent3);
  }
  .trans-tag.big { font-size: 0.65rem; padding: 4px 11px; }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
  }

  .card-desc {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .card-meta .date {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  .card-meta .read-more {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--accent3);
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .card-meta .read-more.full { color: var(--accent); }

  /* ── LOADING BOX ── */
  .load-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 36px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 280px;
    max-width: 360px;
    width: 90%;
    box-shadow: var(--shadow);
  }
  .load-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }
  .load-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.03em;
  }
  .load-bar-track {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .load-bar-fill {
    height: 100%;
    width: 5%;
    background: var(--accent);
    border-radius: 99px;
    box-shadow: 0 0 8px rgba(200,240,96,0.4);
    transition: width 1.2s cubic-bezier(.4,0,.2,1), background 0.4s;
  }
  .load-sub {
    font-size: 0.68rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  /* ── STATE ── */
  .state-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 60px 20px;
    gap: 14px;
    color: var(--muted);
  }
  .state-view svg { opacity: 0.3; }
  .state-view p { font-size: 0.82rem; letter-spacing: 0.02em; }

  .spinner-ring {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .error-msg {
    background: rgba(255,107,107,0.08);
    color: var(--bear);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    font-size: 0.78rem;
    max-width: 420px;
    text-align: center;
    line-height: 1.6;
  }

  .articles-count {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── WELCOME ── */
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 60px 24px;
    gap: 18px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  .eyebrow {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
  }

  .welcome-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--text);
    line-height: 1.1;
  }
  .welcome-screen h2 span { color: var(--accent); font-style: normal; }

  .welcome-screen p {
    font-size: 0.8rem;
    color: var(--muted);
    max-width: 420px;
    line-height: 1.7;
  }

  /* ── MODE CARDS ── */
  .mode-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }
  .mode-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    text-align: left;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.15s;
  }
  .mode-card:hover {
    border-color: var(--accent);
    background: rgba(200,240,96,0.06);
    transform: translateY(-2px);
  }
  .mode-card .mc-emoji { font-size: 1.3rem; }
  .mode-card b { font-size: 0.92rem; letter-spacing: 0.02em; }
  .mode-card span { font-size: 0.68rem; color: var(--muted); }

  .journal-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    max-width: 720px;
  }
  .journal-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.02em;
  }
  .journal-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,240,96,0.06);
  }

  /* ── MODAL (reader + confirm) ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; animation: fadeDown 0.2s ease both; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-hover);
    animation: fadeUp 0.25s ease both;
  }
  .modal.reader { max-width: 760px; }
  .modal.confirm { max-width: 420px; }

  .reader-head {
    position: sticky;
    top: 0;
    background: var(--surface);
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-close {
    position: absolute;
    top: 18px; right: 20px;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--bear); border-color: var(--bear); }

  .reader-title {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    line-height: 1.25;
    color: var(--text);
    margin: 14px 0 6px;
    padding-right: 36px;
  }
  .reader-orig {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 8px;
    font-style: italic;
  }
  .reader-meta {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .reader-body {
    padding: 22px 28px 8px;
  }
  .reader-body p {
    font-size: 0.86rem;
    line-height: 1.85;
    color: var(--text);
    margin-bottom: 14px;
  }
  .reader-loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 50px 20px;
    color: var(--muted);
    font-size: 0.78rem;
  }
  .reader-foot {
    position: sticky;
    bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn-primary {
    background: var(--accent);
    color: #0e0e0e;
    border: none;
    border-radius: 50px;
    padding: 9px 20px;
    font-size: 0.76rem;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    transition: transform 0.1s, box-shadow 0.2s;
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 18px rgba(200,240,96,0.25); }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 9px 20px;
    font-size: 0.76rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--text); }

  /* ── CONFIRM ── */
  .confirm-inner { padding: 28px 26px 22px; text-align: center; }
  .confirm-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    margin: 0 auto 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    background: rgba(96,200,240,0.1);

async function loadFeed(catKey, force) {
  if (!currentJournal) return;
  currentCat = catKey;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === catKey));
  const cached = !force && transCache.has(`${currentJournal.id}|${catKey}|${uiLang}`);
  if (!cached) showLoading();
  const arts = await getJournalArticles(currentJournal, catKey, force);
  if (!arts) { hideLoading(); showError(t('errFeed')); return; }
  allArticles = arts;
  hideLoading();
  renderArticles();
  prefetchJournal(currentJournal); // warm the other tabs in the background
}

// fetch+parse (rawCache) then translate to current uiLang (transCache)
async function getJournalArticles(j, cat, force) {
  const rk = `${j.id}|${cat}`;
  let raw = force ? null : rawCache.get(rk);
  if (!raw) {
    const xml = await fetchRSS(j.feeds[cat]);
    if (!xml) return null;
    raw = parseRSS(xml, j).slice(0, LIMIT_JOURNAL);
    rawCache.set(rk, raw);
  }
  const tk = `${rk}|${uiLang}`;
  let tr = force ? null : transCache.get(tk);
  if (!tr) {
    tr = await translateArticles(cloneArts(raw), j);
    transCache.set(tk, tr);
  }
  return tr;
}

// background warm-up: load remaining categories for the open journal, sequentially & gently
async function prefetchJournal(j) {
  const keys = CAT_ORDER.filter(k => j.feeds[k]);
  for (const k of keys) {
    if (currentJournal !== j || mode !== 'journal') return; // user moved on
    if (transCache.has(`${j.id}|${k}|${uiLang}`)) continue;
    try { await getJournalArticles(j, k); } catch { /* ignore */ }
  }
}

// ─────────────────────────────────────────────
// AGGREGATION ENGINE
// ─────────────────────────────────────────────
async function loadAggregated(kind, feedSelector, force) {
  const ak = `${kind}|${uiLang}`;
  if (!force && aggCache.has(ak)) { allArticles = aggCache.get(ak); renderArticles(); return; }
  showLoading();
  const tasks = JOURNALS.map(async j => {
    const url = feedSelector(j);
    if (!url) return [];
    try {
      const xml = await fetchRSS(url);
      if (!xml) return [];
      let arts = parseRSS(xml, j).slice(0, LIMIT_AGG);
      arts = await translateArticles(arts, j);
      return arts;
    } catch { return []; }
  });
  const results = await Promise.allSettled(tasks);
  // one list per journal (each feed is already newest-first)
  let lists = results.filter(r => r.status === 'fulfilled').map(r => r.value).filter(l => l.length);
  // drop items that carry a real date older than the freshness window
  let fresh = lists.map(l => l.filter(a => !isStale(a)));
  if (!fresh.some(l => l.length)) fresh = lists; // safety: never blank the page
  // round-robin interleave so the newest from EVERY source surfaces first,
  // then a stable sort by date keeps genuinely-newer items on top
  let merged = interleave(fresh);
  merged.sort((a, b) => effDate(b) - effDate(a));
  aggCache.set(ak, merged);
  allArticles = merged;
  hideLoading();
  if (merged.length) renderArticles();
  else showError(t('errAgg'));
}

// ─────────────────────────────────────────────
// FETCH — multi-proxy fallback chain
// ─────────────────────────────────────────────
const PROXIES = [
  url => ({ mode: 'json',   fetch: `https://api.allorigins.win/get?url=${encodeURIComponent(url)}` }),
  url => ({ mode: 'raw',    fetch: `https://corsproxy.io/?url=${encodeURIComponent(url)}` }),
  url => ({ mode: 'raw',    fetch: `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` }),
  url => ({ mode: 'direct', fetch: url }),
];

function fetchWithTimeout(url, ms = 9000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(id));
}

async function proxyFetchText(url) {
  for (const proxyFn of PROXIES) {
    const { mode, fetch: proxyUrl } = proxyFn(url);
    try {
      const res = await fetchWithTimeout(proxyUrl, 9000);
      if (!res.ok) continue;
      let text;
      if (mode === 'json') { const d = await res.json(); text = d.contents; }
      else text = await res.text();
      if (text && text.length) return text;
    } catch { continue; }
  }
  return null;
}

// append a cache-buster so proxies/CDNs return the live feed, not a cached one
function bust(url) { return url + (url.includes('?') ? '&' : '?') + '_cb=' + Date.now(); }

async function fetchRSS(feedUrl) {
  feedUrl = bust(feedUrl);
  for (const proxyFn of PROXIES) {
    const { mode, fetch: proxyUrl } = proxyFn(feedUrl);
    try {
      const res = await fetchWithTimeout(proxyUrl, 9000);
      if (!res.ok) continue;
      let text;
      if (mode === 'json') { const d = await res.json(); text = d.contents; }
      else text = await res.text();
      if (!text || text.length < 100) continue;
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      if (xml.querySelector('item, entry')) return xml;
    } catch { continue; }
  }
  return null;
}

// ─────────────────────────────────────────────
// PARSING
// ─────────────────────────────────────────────
function txt(node, sel) { const n = node.querySelector(sel); return n ? n.textContent.trim() : ''; }

function parseRSS(xml, journal) {
  let nodes = Array.from(xml.querySelectorAll('item'));
  if (!nodes.length) nodes = Array.from(xml.querySelectorAll('entry'));
  return nodes.map(node => {
    const title = txt(node, 'title');
    let desc = (txt(node, 'description') || txt(node, 'summary')).replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    let link = txt(node, 'link');
    if (!link) { const l = node.querySelector('link'); if (l) link = l.getAttribute('href') || ''; }
    let pubDate = txt(node, 'pubDate') || txt(node, 'published') || txt(node, 'updated');
    if (!pubDate) { const dc = node.getElementsByTagName('dc:date')[0]; if (dc) pubDate = dc.textContent.trim(); }
    if (!pubDate) pubDate = txt(node, 'date');
    const cat = txt(node, 'category');

    let fullHtml = '';
    const enc = node.getElementsByTagName('content:encoded')[0];
    if (enc) fullHtml = enc.textContent || '';
    if (!fullHtml) { const c = node.getElementsByTagName('content')[0]; if (c) fullHtml = c.textContent || ''; }
    const fullParas = htmlToParas(fullHtml);
    const hasFull = fullParas.join(' ').length > 600;

    return {
      rawTitle: title, rawDesc: desc, title, desc,
      link: link || '', pubDate, cat,
      journalId: journal.id, srcLang: journal.lang, translated: false,
      fullParas: hasFull ? fullParas : [], hasFull
    };
  }).filter(a => a.rawTitle);
}

function cloneArts(arts) { return arts.map(a => Object.assign({}, a)); }

function htmlToParas(html) {
  if (!html) return [];
  let t = html
    .replace(/<(script|style)[^>]*>[\s\S]*?<\/\1>/gi, '')
    .replace(/<\/(p|div|h[1-6]|li|blockquote)>/gi, '\n\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<[^>]*>/g, '');
  const ta = document.createElement('textarea'); ta.innerHTML = t; t = ta.value;
  return t.split(/\n{2,}/).map(s => s.replace(/\s+/g, ' ').trim()).filter(s => s.length > 1);
}

// articles older than this (when they DO carry a date) are dropped from aggregated views
const STALE_DAYS = 10;
// effective sort timestamp: real date if parseable, else "now" so fresh-but-undated
// items stay on top instead of sinking below genuinely old ones
function effDate(a) { const t = Date.parse(a.pubDate); return isNaN(t) ? Date.now() : t; }
function isStale(a) { const t = Date.parse(a.pubDate); return !isNaN(t) && (Date.now() - t) > STALE_DAYS * 86400000; }
// round-robin merge of several already-sorted lists (rank 0 from each, then rank 1, …)
function interleave(lists) {
  const out = []; let i = 0, more = true;
  while (more) { more = false; for (const l of lists) { if (i < l.length) { out.push(l[i]); more = true; } } i++; }
  return out;
}

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Math.floor((Date.now() - d) / 60000);
  if (diff < 1)    return uiLang === 'it' ? 'Adesso' : uiLang === 'fi' ? 'Juuri nyt' : 'Just now';
  if (diff < 60)   return `${diff}m`;
  if (diff < 1440) return `${Math.floor(diff / 60)}h`;
  const loc = uiLang === 'it' ? 'it-IT' : uiLang === 'fi' ? 'fi-FI' : 'en-GB';
  return d.toLocaleDateString(loc, { day: 'numeric', month: 'short' });
}

// ─────────────────────────────────────────────
// TRANSLATION (free Google gtx endpoint → uiLang, batched + cached)
// ─────────────────────────────────────────────
async function translateArticles(arts, j) {
  if (j.lang === uiLang) {
    arts.forEach(a => { a.title = a.rawTitle; a.desc = a.rawDesc; a.translated = false; });
    return arts;
  }
  let tT, tD;
  try {
    [tT, tD] = await Promise.all([
      translateLines(arts.map(a => a.rawTitle), j.lang, uiLang),
      translateLines(arts.map(a => a.rawDesc || ''), j.lang, uiLang)
    ]);
  } catch { tT = arts.map(a => a.rawTitle); tD = arts.map(a => a.rawDesc); }
  arts.forEach((a, i) => {
    a.title = tT[i] || a.rawTitle;
    a.desc  = tD[i] || a.rawDesc;
    a.translated = true;
  });
  return arts;
}

async function translateLines(lines, sl, tl) {
  if (!sl || sl === tl) return lines.slice();
  const out = new Array(lines.length);
  let batch = [], idx = [], size = 0;
  const flush = async () => {
    if (!batch.length) return;
    const tr = await gtxBatch(batch, sl, tl);
    tr.forEach((tt, k) => { const i = idx[k]; out[i] = tt; translationCache.set(`${sl}>${tl}::${lines[i]}`, tt); });
    batch = []; idx = []; size = 0;
  };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i] || '';
    if (!ln) { out[i] = ''; continue; }
    const key = `${sl}>${tl}::${ln}`;
    if (translationCache.has(key)) { out[i] = translationCache.get(key); continue; }
    if (size + ln.length > 1400 && batch.length) await flush();
    batch.push(ln); idx.push(i); size += ln.length + 1;
  }
  await flush();
  for (let i = 0; i < lines.length; i++) if (out[i] === undefined) out[i] = lines[i];
  return out;
}

async function gtxBatch(lines, sl, tl) {
  const q = lines.join('\n');
  const api = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(q)}`;
  const text = await proxyFetchText(api);
  if (!text) return lines;
  let data;
  try { data = JSON.parse(text); } catch { return lines; }
  const segs = (data && data[0]) || [];
  const full = segs.map(s => (s && s[0]) ? s[0] : '').join('');
  const outLines = full.split('\n');
  if (outLines.length === lines.length) return outLines;
  if (outLines.length > lines.length) return outLines.slice(0, lines.length);
  return lines.map((l, i) => (outLines[i] !== undefined && outLines[i] !== '') ? outLines[i] : l);
}

// ─────────────────────────────────────────────
// RENDER ARTICLES
// ─────────────────────────────────────────────
function renderArticles() {
  const sv = document.getElementById('stateView');
  const al = document.getElementById('articlesList');
  sv.style.display = 'none';
  al.style.display = 'block';

  const q = searchQuery.toLowerCase();
  displayed = q
    ? allArticles.filter(a => a.title.toLowerCase().includes(q) || (a.desc || '').toLowerCase().includes(q))
    : allArticles.slice();

  if (!displayed.length) {
    al.innerHTML = `<div class="state-view" style="display:flex">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>${q ? t('noMatch') : t('noArticles')}</p>
    </div>`;
    return;
  }

  al.innerHTML = `
    <div class="articles-count">${t('articlesCount', displayed.length)}${mode !== 'journal' ? t('acrossJournals') : ''}</div>
    <div class="articles-grid">${displayed.map((a, i) => articleCard(a, i)).join('')}</div>`;
}

function articleCard(a, i) {
  const j = journalById(a.journalId);
  const delay = Math.min(i * 0.03, 0.4);
  const showJournal = mode !== 'journal';
  const jBadge = showJournal
    ? `<span class="card-journal-badge" style="background:${j.colorSoft};color:${j.color}">${j.flag} ${escHtml(j.name)}</span>`
    : '';
  const catBadge = (mode === 'journal' && a.cat)
    ? `<span class="card-category-badge">${escHtml(a.cat.slice(0, 24))}</span>`
    : '';
  const transTag = a.translated
    ? `<span class="trans-tag" title="${escAttr(langName(a.srcLang))}">↻ ${a.srcLang.toUpperCase()}→${uiLang.toUpperCase()}</span>`
    : '';
  const action = a.hasFull
    ? `<span class="read-more full">${t('readHere')}</span>`
    : `<span class="read-more">${t('openLink')}</span>`;
  return `
    <div class="article-card clickable" onclick="openArticle(${i})" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')openArticle(${i})" style="animation-delay:${delay}s">
      <div class="card-badges">${jBadge}${catBadge}${transTag}</div>
      <div class="card-title">${escHtml(a.title)}</div>
      ${a.desc ? `<div class="card-desc">${escHtml(a.desc.slice(0, 200))}</div>` : ''}
      <div class="card-meta">
        <span class="date">${formatDate(a.pubDate)}</span>
        ${action}
      </div>
    </div>`;
}

function escHtml(str) {
  return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(str) { return (str || '').replace(/"/g, '%22').replace(/'/g, '%27'); }

// ─────────────────────────────────────────────
// CARD ACTION: read here (full text) OR confirm external link
// ─────────────────────────────────────────────
function openArticle(i) {
  const a = displayed[i];
  if (!a) return;
  if (a.hasFull) openReader(a);
  else openConfirm(a);
}

async function openReader(a) {
  const j = journalById(a.journalId);
  openOverlay('reader');
  let paras = a.fullParas || [];
  if (a.translated) {
    document.getElementById('modalBox').innerHTML = `
      <div class="reader-loading"><div class="spinner-ring"></div>
      <p>${t('translating', langName(a.srcLang))}</p></div>`;
    if (!a._trParas) {
      try { a._trParas = await translateLines(paras, a.srcLang, uiLang); }
      catch { a._trParas = paras; }
    }
    paras = a._trParas;
  }
  document.getElementById('modalBox').innerHTML = readerHtml(a, j, paras);
}

function readerHtml(a, j, paras) {
  const transBadge = a.translated ? `<span class="trans-tag big">${t('translatedFrom', langName(a.srcLang))}</span>` : '';
  const orig = (a.translated && a.rawTitle) ? `<div class="reader-orig">${t('original', langName(a.srcLang))}${escHtml(a.rawTitle)}</div>` : '';
  const body = paras.length
    ? paras.map(p => `<p>${escHtml(p)}</p>`).join('')
    : `<p>${escHtml(a.desc || '')}</p>`;
  return `
    <div class="reader-head">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      <div class="card-badges">
        <span class="card-journal-badge" style="background:${j.colorSoft};color:${j.color}">${j.flag} ${escHtml(j.name)}</span>
        ${transBadge}
      </div>
      <h2 class="reader-title">${escHtml(a.title)}</h2>
      ${orig}
      <div class="reader-meta">${formatDate(a.pubDate)}${a.cat ? ' · ' + escHtml(a.cat) : ''}</div>
    </div>
    <div class="reader-body">${body}</div>
    <div class="reader-foot">
      <button class="btn-ghost" onclick="closeModal()">${t('close')}</button>
      ${a.link ? `<a class="btn-primary" href="${escAttr(a.link)}" target="_blank" rel="noopener">${t('openOriginal')}</a>` : ''}
    </div>`;
}

function openConfirm(a) {
  const j = journalById(a.journalId);
  pendingLink = a.link || null;
  openOverlay('confirm');
  document.getElementById('modalBox').innerHTML = `
    <div class="confirm-inner">
      <div class="confirm-icon">↗</div>
      <h3 class="confirm-title">${t('confirmTitle')}</h3>
      <p class="confirm-text">${t('confirmText', escHtml(j.name))}</p>
      <div class="confirm-snippet">${escHtml(a.title)}</div>
      <div class="confirm-actions">
        <button class="btn-ghost" onclick="closeModal()">${t('cancel')}</button>
        <button class="btn-primary" onclick="doOpenPending()" ${pendingLink ? '' : 'disabled'}>${t('okOpen')}</button>
      </div>
    </div>`;
}

function doOpenPending() {
  if (pendingLink) window.open(pendingLink, '_blank', 'noopener');
  closeModal();
}

function openOverlay(kind) {
  document.getElementById('modalBox').className = 'modal ' + kind;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  pendingLink = null;
}
function onOverlayClick(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

// ─────────────────────────────────────────────
// LOADING / ERROR STATES
// ─────────────────────────────────────────────
let loadingInterval = null;

function showLoading() {
  const sv = document.getElementById('stateView');
  document.getElementById('articlesList').style.display = 'none';
  sv.style.display = 'flex';
  const steps = t('loadingSteps');
  let step = 0;
  sv.innerHTML = `
    <div class="load-box">
      <div class="load-spinner"></div>
      <div class="load-label" id="loadLabel">${steps[0]}</div>
      <div class="load-bar-track"><div class="load-bar-fill" id="loadBarFill"></div></div>
      <div class="load-sub">${steps[0]}</div>
    </div>`;
  clearInterval(loadingInterval);
  let pct = 5;
  loadingInterval = setInterval(() => {
    pct = Math.min(pct + Math.random() * 16, 85);
    const fill = document.getElementById('loadBarFill');
    const label = document.getElementById('loadLabel');
    if (fill) fill.style.width = pct + '%';
    if (label && step < steps.length - 1) { step++; label.textContent = steps[step]; }
  }, 1300);
}

function hideLoading() {
  clearInterval(loadingInterval);
  const fill = document.getElementById('loadBarFill');
  if (fill) fill.style.width = '100%';
}

function showError(msg) {
  const sv = document.getElementById('stateView');
  document.getElementById('articlesList').style.display = 'none';
  sv.style.display = 'flex';
  sv.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

// ─────────────────────────────────────────────
// SEARCH & REFRESH
// ─────────────────────────────────────────────
function filterArticles() {
  searchQuery = document.getElementById('searchInput').value;
  if (allArticles.length) renderArticles();
}

function refreshFeed() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  const done = () => btn.classList.remove('spinning');
  let p = null;
  if (mode === 'journal' && currentJournal) {
    rawCache.delete(`${currentJournal.id}|${currentCat}`);
    transCache.delete(`${currentJournal.id}|${currentCat}|${uiLang}`);
    p = loadFeed(currentCat, true);
  } else if (mode === 'category') {
    aggCache.delete(`cat:${currentCategory}|${uiLang}`);
    p = loadCategory(currentCategory, true);
  } else if (mode === 'latest') {
    aggCache.delete(`latest|${uiLang}`);
    p = loadLatest(true);
  }
  if (p && p.then) p.then(done).catch(done);
  else setTimeout(done, 500);
}

// ─────────────────────────────────────────────
function backBtn() {
  return `<button class="back-btn" onclick="goHome()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg> ${t('home')}
    </button>`;
}

init();
</script>
