<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EuroPress — European News Reader</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EuroPress">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg:      #0e0e0e;
    --surface: #161616;
    --card:    #1c1c1c;
    --border:  #2a2a2a;
    --accent:  #c8f060;
    --accent2: #f0b860;
    --accent3: #60c8f0;
    --text:    #f0ede8;
    --muted:   #888;
    --bull:    #c8f060;
    --bear:    #ff6b6b;
    --radius:  16px;
    --radius-sm: 10px;
    --shadow:  0 2px 16px rgba(0,0,0,0.4);
    --shadow-hover: 0 6px 32px rgba(0,0,0,0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(200,240,96,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 10% 90%, rgba(96,200,240,0.04) 0%, transparent 60%);
  }

  header, .app-body, .sidebar, .main { position: relative; z-index: 1; }

  /* ── TOP BAR ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 28px;
    height: 58px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 1px 0 var(--border);
  }

  .logo {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--text);
    white-space: nowrap;
    letter-spacing: -0.3px;
    cursor: pointer;
  }
  .logo { display: flex; align-items: center; }
  .logo span { color: var(--accent); font-style: normal; }
  .logo-img { width: 26px; height: 26px; border-radius: 7px; margin-right: 9px; flex-shrink: 0; }

  .search-bar {
    flex: 1;
    max-width: 520px;
    position: relative;
  }
  .search-bar input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px 8px 40px;
    font-size: 0.8rem;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-bar input::placeholder { color: var(--muted); }
  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(200,240,96,0.1);
  }
  .search-bar svg {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%); color: var(--muted);
  }

  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

  /* ── SOCIAL ICONS ── */
  .socials { display: flex; align-items: center; gap: 4px; }
  .social-link {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    color: var(--muted);
    border: 1px solid transparent;
    transition: color 0.15s, background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .social-link:hover {
    color: var(--accent);
    background: rgba(200,240,96,0.07);
    border-color: rgba(200,240,96,0.2);
    transform: translateY(-1px);
  }
  .social-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }

  .lang-select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    border-radius: 50px;
    padding: 6px 10px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.15s;
  }
  .lang-select:hover { border-color: var(--accent); }

  /* refresh + language stacked in two rows so refresh isn't pushed to the edge */
  .controls { display: flex; flex-direction: column; gap: 5px; align-items: stretch; }
  .controls .lang-select,
  .controls .refresh-btn {
    width: 100%;
    padding: 4px 14px;
    font-size: 0.68rem;
    justify-content: center;
  }
  .controls .refresh-btn svg { width: 11px; height: 11px; }

  /* countdown to the next scheduled fetch (replaces manual refresh) */
  .update-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border: 1px solid var(--border);
    border-radius: 50px;
    font-size: 0.64rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    justify-content: center;
    cursor: default;
    user-select: none;
  }
  .update-chip .upd-ic { color: var(--accent); flex-shrink: 0; }
  .update-chip.updating { color: var(--accent); border-color: rgba(200,240,96,0.3); }
  .update-chip.updating .upd-ic { animation: spin 0.9s linear infinite; }

  .refresh-btn {
    background: rgba(200,240,96,0.08);
    color: var(--accent);
    border: 1px solid rgba(200,240,96,0.25);
    border-radius: 50px;
    padding: 7px 16px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s, transform 0.1s;
    text-transform: uppercase;
  }
  .refresh-btn:hover { background: rgba(200,240,96,0.14); transform: scale(1.02); }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    from { background-position: 200% center; }
    to   { background-position: -200% center; }
  }

  /* ── LAYOUT ── */
  .app-body {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-label {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 6px 10px 8px;
  }
  .sidebar-label::after {
    content: '';
    display: block;
    width: 40px;
    height: 1px;
    background: var(--border);
    margin-top: 6px;
  }

  .journal-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    color: var(--muted);
    width: 100%;
    text-align: left;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .journal-btn:hover { background: var(--card); color: var(--text); border-color: var(--border); }
  .journal-btn.active {
    background: rgba(200,240,96,0.07);
    color: var(--accent);
    border-color: rgba(200,240,96,0.2);
    font-weight: 500;
  }
  .journal-btn .lang-chip {
    margin-left: auto;
    font-size: 0.55rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    text-transform: uppercase;
  }

  .journal-icon {
    width: 28px; height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    font-weight: 500;
    flex-shrink: 0;
    letter-spacing: -0.5px;
    border: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
  }
  .journal-icon.emoji { font-size: 0.9rem; background: var(--card); }

  /* ── MAIN ── */
  .main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* ── JOURNAL HEADER ── */
  .journal-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px 0;
    position: sticky;
    top: 0;
    z-index: 50;
    animation: fadeDown 0.3s ease both;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px 5px 8px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    transition: all 0.15s;
    white-space: nowrap;
    margin-bottom: 14px;
  }
  .back-btn:hover {
    background: var(--card);
    border-color: var(--accent);
    color: var(--accent);
  }
  .back-btn svg { flex-shrink: 0; }

  .journal-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .journal-title h1 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.3rem;
    color: var(--text);
    line-height: 1.1;
  }
  .journal-title .flag { font-size: 1.1rem; font-style: normal; }
  .journal-subtitle {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  /* ── CATEGORY TABS ── */
  /* category chips wrap onto multiple lines — every category visible, no side-scroll */
  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-bottom: 16px;
  }

  .cat-tab {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 50px;
    background: transparent;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
  }
  .cat-tab:hover { color: var(--text); border-color: #3a3a3a; }
  .cat-tab.active {
    color: var(--accent);
    border-color: rgba(200,240,96,0.4);
    background: rgba(200,240,96,0.08);
    font-weight: 500;
  }

  /* ── ARTICLE GRID ── */
  .articles-area { padding: 24px 28px; flex: 1; overflow-y: auto; }

  .articles-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 14px;
  }

  .article-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px 20px;
    transition: box-shadow 0.2s, transform 0.15s, border-color 0.2s;
    display: flex;
    flex-direction: column;
    gap: 10px;
    animation: fadeUp 0.35s ease both;
    color: inherit;
    user-select: none;
  }
  .article-card.clickable { cursor: pointer; }
  .article-card.clickable:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
    border-color: #3a3a3a;
  }
  .article-card.clickable:active { transform: scale(0.99); }

  .card-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .card-category-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    width: fit-content;
    border: 1px solid rgba(200,240,96,0.25);
    background: rgba(200,240,96,0.07);
    color: var(--accent);
  }

  .card-journal-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    width: fit-content;
    border: 1px solid var(--border);
  }

  .trans-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: 99px;
    font-size: 0.58rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border: 1px solid rgba(96,200,240,0.28);
    background: rgba(96,200,240,0.08);
    color: var(--accent3);
  }
  .trans-tag.big { font-size: 0.65rem; padding: 4px 11px; }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 0.88rem;
    font-weight: 500;
    line-height: 1.5;
    color: var(--text);
  }

  .card-desc {
    font-size: 0.76rem;
    color: var(--muted);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .card-meta .date {
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  .card-meta .read-more {
    margin-left: auto;
    font-size: 0.68rem;
    color: var(--accent3);
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .card-meta .read-more.full { color: var(--accent); }

  /* ── LOADING BOX ── */
  .load-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 40px 36px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 280px;
    max-width: 360px;
    width: 90%;
    box-shadow: var(--shadow);
  }
  .load-spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
    flex-shrink: 0;
  }
  .load-label {
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text);
    text-align: center;
    letter-spacing: 0.03em;
  }
  .load-bar-track {
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .load-bar-fill {
    height: 100%;
    width: 5%;
    background: var(--accent);
    border-radius: 99px;
    box-shadow: 0 0 8px rgba(200,240,96,0.4);
    transition: width 1.2s cubic-bezier(.4,0,.2,1), background 0.4s;
  }
  .load-sub {
    font-size: 0.68rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
    letter-spacing: 0.02em;
  }

  /* ── STATE ── */
  .state-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 60px 20px;
    gap: 14px;
    color: var(--muted);
  }
  .state-view svg { opacity: 0.3; }
  .state-view p { font-size: 0.82rem; letter-spacing: 0.02em; }

  .spinner-ring {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .error-msg {
    background: rgba(255,107,107,0.08);
    color: var(--bear);
    border: 1px solid rgba(255,107,107,0.25);
    border-radius: var(--radius-sm);
    padding: 14px 20px;
    font-size: 0.78rem;
    max-width: 420px;
    text-align: center;
    line-height: 1.6;
  }

  .articles-count {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* ── WELCOME ── */
  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 60px 24px;
    gap: 18px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  .welcome-logo {
    width: 88px;
    height: 88px;
    border-radius: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 2px;
  }

  .eyebrow {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--accent);
  }

  .welcome-screen h2 {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    color: var(--text);
    line-height: 1.1;
  }
  .welcome-screen h2 span { color: var(--accent); font-style: normal; }

  .welcome-screen p {
    font-size: 0.8rem;
    color: var(--muted);
    max-width: 420px;
    line-height: 1.7;
  }

  /* ── MODE CARDS ── */
  .mode-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 6px;
  }
  .mode-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    text-align: left;
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: all 0.15s;
  }
  .mode-card:hover {
    border-color: var(--accent);
    background: rgba(200,240,96,0.06);
    transform: translateY(-2px);
  }
  .mode-card .mc-emoji { font-size: 1.3rem; }
  .mode-card b { font-size: 0.92rem; letter-spacing: 0.02em; }
  .mode-card span { font-size: 0.68rem; color: var(--muted); }

  .journal-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 8px;
    max-width: 720px;
  }
  .journal-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50px;
    padding: 8px 18px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
    letter-spacing: 0.02em;
  }
  .journal-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(200,240,96,0.06);
  }

  /* ── MODAL (reader + confirm) ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; animation: fadeDown 0.2s ease both; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    box-shadow: var(--shadow-hover);
    animation: fadeUp 0.25s ease both;
  }
  .modal.reader { max-width: 760px; }
  .modal.confirm { max-width: 420px; }

  .reader-head {
    position: sticky;
    top: 0;
    background: var(--surface);
    padding: 24px 28px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-close {
    position: absolute;
    top: 18px; right: 20px;
    width: 30px; height: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.15s;
  }
  .modal-close:hover { color: var(--bear); border-color: var(--bear); }

  .reader-title {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 1.5rem;
    line-height: 1.25;
    color: var(--text);
    margin: 14px 0 6px;
    padding-right: 36px;
  }
  .reader-orig {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 8px;
    font-style: italic;
  }
  .reader-meta {

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let uiLang = 'it';
let mode = 'home';

let currentCat = null;
let currentCategory = null;
let allArticles = [];
let displayed = [];
let searchQuery = '';

let SNAP = null;                 // snapshot for the current language
const snapByLang = {};           // lang -> snapshot cache
let clockTimer = null, polling = false, lastPoll = 0;

// ─────────────────────────────────────────────
// I18N HELPERS
// ─────────────────────────────────────────────
function t(key, ...args) {
  const dict = I18N[uiLang] || I18N.it;
  let v = dict[key];
  if (v === undefined) v = I18N.en[key];
  return typeof v === 'function' ? v(...args) : v;
}
function catLabel(c) { return (I18N[uiLang].cats || I18N.en.cats)[c] || c; }
function langName(code) { return (I18N[uiLang].langNames || I18N.en.langNames)[code] || code; }
function journalById(id) { return JOURNALS.find(j => j.id === id); }

// ─────────────────────────────────────────────
// SNAPSHOT LOADING
// ─────────────────────────────────────────────
async function fetchSnap(lang, bust) {
  try {
    const url = `data/snapshot.${lang}.json` + (bust ? `?_=${Date.now()}` : '');
    const res = await fetch(url, { cache: bust ? 'no-store' : 'default' });
    if (!res.ok) return null;
    return await res.json();
  } catch { return null; }
}
async function loadSnapshot(lang) {
  if (snapByLang[lang]) return snapByLang[lang];
  const d = await fetchSnap(lang, false);
  if (d) snapByLang[lang] = d;
  return d;
}
function hasData() { return !!(SNAP && SNAP.ts && SNAP.journals && Object.keys(SNAP.journals).length); }

function fromSnap(art, jid) {
  const j = journalById(jid);
  return {
    title: art.t, desc: art.d || '', link: art.l || '', pubDate: art.p || '', cat: art.c || '',
    journalId: jid, srcLang: art.s || (j ? j.lang : 'en'),
    translated: !!art.o, rawTitle: art.o || art.t,
    fullParas: art.f || [], hasFull: !!(art.f && art.f.length),
  };
}
function getArticles(jid, cat) {
  const feed = SNAP && SNAP.journals && SNAP.journals[jid] && SNAP.journals[jid][cat];
  return feed ? feed.map(a => fromSnap(a, jid)) : [];
}
function journalCats(j) {
  if (!hasData()) return CAT_ORDER.filter((_, i) => i < 3); // placeholder tabs
  return CAT_ORDER.filter(k => (SNAP.journals[j.id] || {})[k] && SNAP.journals[j.id][k].length);
}
function aggCats() {
  return AGG_CATS.filter(c => JOURNALS.some(j => (SNAP && SNAP.journals[j.id] || {})[c] && SNAP.journals[j.id][c].length));
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
async function init() {
  uiLang = localStorage.getItem('europress_lang') || 'it';
  document.getElementById('langSelect').value = uiLang;
  SNAP = await loadSnapshot(uiLang);
  applyI18n();
  startClock();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

async function setLang(l) {
  if (l === uiLang) return;
  uiLang = l;
  localStorage.setItem('europress_lang', l);
  document.getElementById('langSelect').value = l;
  SNAP = (await loadSnapshot(l)) || SNAP;
  applyI18n();
}

function applyI18n() {
  document.documentElement.lang = uiLang;
  document.getElementById('searchInput').placeholder = t('searchPh');
  renderSidebar();
  renderWelcome();
  reRenderView();
}

// redraw header + content for the active mode
function reRenderView() {
  if (mode === 'journal' && currentJournal) { renderJournalHeader(); loadFeed(currentCat); }
  else if (mode === 'category') { renderCategoryHeader(); loadCategory(currentCategory); }
  else if (mode === 'latest') { renderLatestHeader(); loadLatest(); }
}

function renderSidebar() {

}

function renderWelcome() {
  document.getElementById('welcomeScreen').innerHTML = `
    <img src="icon.svg" alt="EuroPress" class="welcome-logo">
    <div class="eyebrow">${t('welcomeEyebrow')}</div>
    <h2>Euro<span>Press</span></h2>

      <button class="mode-card" onclick="openCategoryView()">

    </div>
    <div class="journal-pills" id="quickPills"></div>`;
  document.getElementById('quickPills').innerHTML = JOURNALS.map(j => `
    <button class="journal-pill" onclick="selectJournal('${j.id}')">
      <span>${j.flag}</span> ${j.name}${j.lang !== uiLang ? ` · ${j.lang.toUpperCase()}→${uiLang.toUpperCase()}` : ''}
    </button>`).join('');
}

function setActiveNav(id) {
  document.querySelectorAll('.journal-btn').forEach(b => b.classList.remove('active'));
  const el = id && document.getElementById(id);
  if (el) el.classList.add('active');
}
function setActiveNavForMode() {
  let id = '';
  if (mode === 'journal' && currentJournal) id = 'jbtn-' + currentJournal.id;
  else if (mode === 'category') id = 'nav-category';
  else if (mode === 'latest') id = 'nav-latest';
  setActiveNav(id);
}

function showJournalView() {
  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('journalView').style.display = 'flex';
  document.getElementById('searchBar').style.display = '';
}
function goHome() {
  mode = 'home';
  currentJournal = null; currentCat = null; currentCategory = null;
  allArticles = []; displayed = []; searchQuery = '';
  document.getElementById('searchInput').value = '';
  setActiveNav('');
  document.getElementById('journalView').style.display = 'none';
  document.getElementById('welcomeScreen').style.display = 'flex';
  document.getElementById('searchBar').style.display = 'none';
}

// ─────────────────────────────────────────────
// VIEW: BY JOURNAL
// ─────────────────────────────────────────────
function selectJournal(id) {
  currentJournal = journalById(id);
  mode = 'journal';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  setActiveNav('jbtn-' + id);
  showJournalView();
  currentCat = journalCats(currentJournal)[0] || 'Latest';
  renderJournalHeader();
  loadFeed(currentCat);
}
function renderJournalHeader() {
  const j = currentJournal;
  const keys = journalCats(j);
  const tabs = keys.map(k => `
    <button class="cat-tab ${k === currentCat ? 'active' : ''}" data-cat="${k}"
            onclick="loadFeed('${k}')">${catLabel(k)}</button>`).join('');
  document.getElementById('journalHeader').innerHTML = `
    ${backBtn()}
    <div class="journal-title">
      <span class="flag">${j.flag}</span>
      <div>
        <h1>${j.name}</h1>
        <div class="journal-subtitle">${j.subtitle}${j.lang !== uiLang ? ` ${t('autoSuffix')}` : ''}</div>
      </div>
    </div>
    <div class="cat-tabs">${tabs}</div>`;
}
function loadFeed(catKey) {
  if (!currentJournal) return;
  currentCat = catKey;
  document.querySelectorAll('.cat-tab').forEach(x => x.classList.toggle('active', x.dataset.cat === catKey));
  if (!hasData()) { showError(t('snapshotMissing')); return; }
  allArticles = getArticles(currentJournal.id, catKey);
  renderArticles();
}

// ─────────────────────────────────────────────
// VIEW: BY CATEGORY
// ─────────────────────────────────────────────
function openCategoryView(cat) {
  mode = 'category';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  setActiveNav('nav-category');
  showJournalView();
  const cats = aggCats();
  currentCategory = cat || cats[0] || 'World';
  renderCategoryHeader();
  loadCategory(currentCategory);
}
function renderCategoryHeader() {
  const cats = aggCats();
  const list = cats.length ? cats : AGG_CATS;
  const tabs = list.map(c => `
    <button class="cat-tab ${c === currentCategory ? 'active' : ''}" data-cat="${c}"
            onclick="loadCategory('${c}')">${catLabel(c)}</button>`).join('');
  document.getElementById('journalHeader').innerHTML = `
    ${backBtn()}
    <div class="journal-title">
      <span class="flag">🗂️</span>
      <div><h1>${t('catTitle')}</h1><div class="journal-subtitle">${t('catSub')}</div></div>
    </div>
    <div class="cat-tabs">${tabs}</div>`;
}
function loadCategory(cat) {
  currentCategory = cat;
  document.querySelectorAll('.cat-tab').forEach(x => x.classList.toggle('active', x.dataset.cat === cat));
  loadAggregated(j => getArticles(j.id, cat));
}

// ─────────────────────────────────────────────
// VIEW: LATEST
// ─────────────────────────────────────────────
function openLatestView() {
  mode = 'latest';
  searchQuery = '';
  document.getElementById('searchInput').value = '';
  setActiveNav('nav-latest');
  showJournalView();
  renderLatestHeader();
  loadLatest();
}
function renderLatestHeader() {
  document.getElementById('journalHeader').innerHTML = `
    ${backBtn()}
    <div class="journal-title">
      <span class="flag">🔥</span>
      <div><h1>${t('latestTitle')}</h1><div class="journal-subtitle">${t('latestSub')}</div></div>
    </div>`;
}
function loadLatest() {
  loadAggregated(j => { const a = getArticles(j.id, 'Latest'); return a.length ? a : getArticles(j.id, 'World'); });
}

// ─────────────────────────────────────────────
// AGGREGATION (from snapshot, no network)
// ─────────────────────────────────────────────
function loadAggregated(feedForJournal) {
  if (!hasData()) { showError(t('snapshotMissing')); return; }
  let lists = JOURNALS.map(j => feedForJournal(j)).filter(l => l.length);
  let fresh = lists.map(l => l.filter(a => !isStale(a)));
  if (!fresh.some(l => l.length)) fresh = lists;
  let merged = interleave(fresh);
  merged.sort((a, b) => effDate(b) - effDate(a));
  allArticles = merged;
  if (merged.length) renderArticles(); else showError(t('errAgg'));
}
function effDate(a) { const x = Date.parse(a.pubDate); return isNaN(x) ? Date.now() : x; }
function isStale(a) { const x = Date.parse(a.pubDate); return !isNaN(x) && (Date.now() - x) > STALE_DAYS * 86400000; }
function interleave(lists) {
  const out = []; let i = 0, more = true;
  while (more) { more = false; for (const l of lists) { if (i < l.length) { out.push(l[i]); more = true; } } i++; }
  return out;
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function renderArticles() {
  const sv = document.getElementById('stateView');
  const al = document.getElementById('articlesList');
  sv.style.display = 'none';
  al.style.display = 'block';

  const q = searchQuery.toLowerCase();
  displayed = q
    ? allArticles.filter(a => a.title.toLowerCase().includes(q) || (a.desc || '').toLowerCase().includes(q))
    : allArticles.slice();

  if (!displayed.length) {
    al.innerHTML = `<div class="state-view" style="display:flex">
      <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <p>${q ? t('noMatch') : t('noArticles')}</p></div>`;
    return;
  }
  al.innerHTML = `
    <div class="articles-count">${t('articlesCount', displayed.length)}${mode !== 'journal' ? t('acrossJournals') : ''}</div>
    <div class="articles-grid">${displayed.map((a, i) => articleCard(a, i)).join('')}</div>`;
}

function articleCard(a, i) {
  const j = journalById(a.journalId);
  const delay = Math.min(i * 0.03, 0.4);
  const jBadge = mode !== 'journal'
    ? `<span class="card-journal-badge" style="background:${j.colorSoft};color:${j.color}">${j.flag} ${escHtml(j.name)}</span>` : '';
  const catBadge = (mode === 'journal' && a.cat)
    ? `<span class="card-category-badge">${escHtml(a.cat.slice(0, 24))}</span>` : '';
  const transTag = a.translated
    ? `<span class="trans-tag" title="${escAttr(langName(a.srcLang))}">↻ ${a.srcLang.toUpperCase()}→${uiLang.toUpperCase()}</span>` : '';
  return `
    <div class="article-card clickable" onclick="openArticle(${i})" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter')openArticle(${i})" style="animation-delay:${delay}s">
      <div class="card-badges">${jBadge}${catBadge}${transTag}</div>
      <div class="card-title">${escHtml(a.title)}</div>
      ${a.desc ? `<div class="card-desc">${escHtml(a.desc.slice(0, 200))}</div>` : ''}
      <div class="card-meta">
        <span class="date">${formatDate(a.pubDate)}</span>
        <span class="read-more full">${t('readHere')}</span>
      </div>
    </div>`;
}

function escHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return (s || '').replace(/"/g,'%22').replace(/'/g,'%27'); }

function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Math.floor((Date.now() - d) / 60000);
  if (diff < 1) return t('justNow');
  if (diff < 60) return `${diff}m`;
  if (diff < 1440) return `${Math.floor(diff / 60)}h`;
  const loc = uiLang === 'it' ? 'it-IT' : uiLang === 'fi' ? 'fi-FI' : 'en-GB';
  return d.toLocaleDateString(loc, { day: 'numeric', month: 'short' });
}

// ─────────────────────────────────────────────
// READER (all text is already translated in the snapshot)
// ─────────────────────────────────────────────
function openArticle(i) { const a = displayed[i]; if (a) openReader(a); }

function openReader(a) {
  const j = journalById(a.journalId);
  openOverlay('reader');
  const paras = (a.fullParas && a.fullParas.length) ? a.fullParas : [];
  const incomplete = !paras.length;
  const body = incomplete ? (a.desc ? [a.desc] : []) : paras;
  document.getElementById('modalBox').innerHTML = readerHtml(a, j, body, incomplete);
}

function readerHtml(a, j, paras, incomplete) {
  const transBadge = a.translated ? `<span class="trans-tag big">${t('translatedFrom', langName(a.srcLang))}</span>` : '';
  const orig = (a.translated && a.rawTitle) ? `<div class="reader-orig">${t('original', langName(a.srcLang))}${escHtml(a.rawTitle)}</div>` : '';
  const notice = incomplete ? `<div class="reader-notice">${t('summaryLabel')} · ${t('textUnavailable')}</div>` : '';
  const body = paras.length ? paras.map(p => `<p>${escHtml(p)}</p>`).join('') : `<p>${escHtml(a.desc || '')}</p>`;
  return `
    <div class="reader-head">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">✕</button>
      <div class="card-badges">
        <span class="card-journal-badge" style="background:${j.colorSoft};color:${j.color}">${j.flag} ${escHtml(j.name)}</span>
        ${transBadge}
      </div>
      <h2 class="reader-title">${escHtml(a.title)}</h2>
      ${orig}
      <div class="reader-meta">${formatDate(a.pubDate)}${a.cat ? ' · ' + escHtml(a.cat) : ''}</div>
    </div>
    <div class="reader-body">${notice}${body}</div>
    <div class="reader-foot">
      <button class="btn-ghost" onclick="closeModal()">${t('close')}</button>
      ${a.link ? `<a class="btn-primary" href="${escAttr(a.link)}" target="_blank" rel="noopener">${t('openOriginal')}</a>` : ''}
    </div>`;
}

function openOverlay(kind) {
  document.getElementById('modalBox').className = 'modal ' + kind;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
function onOverlayClick(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

// ─────────────────────────────────────────────
// ERROR STATE
// ─────────────────────────────────────────────
function showError(msg) {
  const sv = document.getElementById('stateView');
  document.getElementById('articlesList').style.display = 'none';
  sv.style.display = 'flex';
  sv.innerHTML = `<div class="error-msg">⚠️ ${msg}</div>`;
}

// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
function filterArticles() {
  searchQuery = document.getElementById('searchInput').value;
  if (allArticles.length || searchQuery) renderArticles();
}

// ─────────────────────────────────────────────
// COUNTDOWN to next scheduled fetch (+ auto-pick-up when it lands)
// ─────────────────────────────────────────────
function startClock() { clearInterval(clockTimer); tickClock(); clockTimer = setInterval(tickClock, 1000); }
function mmss(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
function agoStr(ms) { const m = Math.floor(ms / 60000); if (m < 1) return t('justNow'); if (m < 60) return `${m}m`; return `${Math.floor(m / 60)}h`; }

function tickClock() {
  const chip = document.getElementById('updateChip');
  const txt = document.getElementById('updText');
  if (!chip || !txt) return;
  if (!SNAP || !SNAP.ts) { chip.classList.remove('updating'); txt.textContent = t('waiting'); chip.title = ''; return; }
  const next = SNAP.ts + (SNAP.intervalMin || 30) * 60000;
  const rem = next - Date.now();
  chip.title = t('updatedAgo', agoStr(Date.now() - SNAP.ts));
  if (rem > 1000) {
    chip.classList.remove('updating');
    txt.textContent = t('nextUpdate', mmss(rem));
  } else {
    chip.classList.add('updating');
    txt.textContent = t('updating');
    pollSnapshot();
  }
}

// after the scheduled time passes, poll the static JSON until a newer snapshot appears
async function pollSnapshot() {
  const now = Date.now();
  if (polling || now - lastPoll < 60000) return;
  polling = true; lastPoll = now;
  try {
    const data = await fetchSnap(uiLang, true);
    if (data && data.ts && (!SNAP || data.ts > SNAP.ts)) {
      snapByLang[uiLang] = data;
      SNAP = data;
      Object.keys(snapByLang).forEach(k => { if (k !== uiLang) delete snapByLang[k]; }); // other langs will refetch
      renderSidebar();
      if (mode !== 'home') reRenderView();
    }
  } catch { /* keep old snapshot */ } finally { polling = false; }
}

// ─────────────────────────────────────────────
function backBtn() {
  return `<button class="back-btn" onclick="goHome()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M19 12H5M12 5l-7 7 7 7"/></svg> ${t('home')}
    </button>`;
}

init();
</script>
